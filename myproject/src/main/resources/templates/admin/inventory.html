<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Inventory Management')"></head>

<body>
  <div th:replace="layout :: navbar"></div>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-blood-red">Blood Inventory</h2>
      <a href="/admin/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
    </div>
    <form method="get" class="row g-3 mb-4">
      <div class="col-md-3">
        <label>Blood Type</label>
        <select name="bloodType" class="form-select">
          <option value="">All</option>
          <option th:each="t : ${ {'A+','A-','B+','B-','O+','O-','AB+','AB-'} }" th:value="${t}" th:text="${t}"
            th:selected="${param.bloodType == t}"></option>
        </select>
      </div>
      <div class="col-md-3">
        <label>Status</label>
        <select name="status" class="form-select">
          <option value="">All</option>
          <option value="available" th:selected="${param.status == 'available'}">Available</option>
          <option value="used" th:selected="${param.status == 'used'}">Used</option>
          <option value="expired" th:selected="${param.status == 'expired'}">Expired</option>
        </select>
      </div>
      <div class="col-md-3">
        <label>Sort by Expiry</label>
        <select name="sortExp" class="form-select">
          <option value="asc" th:selected="${param.sortExp == 'asc'}">Earliest first</option>
          <option value="desc" th:selected="${param.sortExp == 'desc'}">Latest first</option>
        </select>
      </div>
      <div class="col-md-3 align-self-end">
        <button type="submit" class="btn btn-blood-red">Filter</button>
        <a href="/admin/inventory" class="btn btn-secondary">Reset</a>
      </div>
    </form>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Blood Type</th>
          <th>Expiry Date</th>
          <th>Status</th>
          <th>Bank</th>
          <th>Donation ID</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="bag : ${bags}">
          <td th:text="${bag.inventoryId}"></td>
          <td th:text="${bag.bloodType}"></td>
          <td th:text="${bag.expdate}"></td>
          <td><span
              th:class="${bag.status == 'available' ? 'badge bg-success' : (bag.status == 'used' ? 'badge bg-secondary' : 'badge bg-danger')}"
              th:text="${bag.status}"></span></td>
          <td th:text="${bag.bankName}"></td>
          <td th:text="${bag.donationId}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div th:replace="layout :: footer"></div>
</body>

</html>
