<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Record Donation')"></head>

<body>
  <div th:replace="layout :: navbar"></div>
  <div class="container mt-4" style="max-width: 600px;">
    <div class="card">
      <div class="card-header">Record New Donation</div>
      <div class="card-body">
        <form th:action="@{/admin/record-donation}" method="post">
          <div class="mb-3">
            <label>Donor</label>
            <select name="donorId" id="donorSelect" class="form-select" required onchange="updateBloodType()">
              <option value="" disabled selected>-- Select Donor --</option>
              <option th:each="d : ${donors}" th:value="${d.id}" th:text="${d.name}"
                th:attr="data-blood=${d.bloodType}">
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label>Donation Address</label>
            <input type="text" name="donateAddr" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Blood Bank</label>
            <select name="bankId" class="form-select" required>
              <option th:each="b : ${banks}" th:value="${b.bankId}" th:text="${b.bankName}"></option>
            </select>
          </div>
          <div class="mb-3">
            <label>Blood Type</label>
            <input type="text" name="bloodType" id="bloodTypeField" class="form-control" readonly placeholder="Auto-filled from donor" required>
          </div>
          <div class="mb-3">
            <label>Number of Bags</label>
            <input type="number" name="numberOfBags" class="form-control" min="1" value="1">
          </div>
          <button type="submit" class="btn btn-blood-red">Save Donation</button>
          <a href="/admin/dashboard" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
  <div th:replace="layout :: footer"></div>

  <script>
    function updateBloodType() {
      const select = document.getElementById('donorSelect');
      const selected = select.options[select.selectedIndex];
      document.getElementById('bloodTypeField').value = selected.getAttribute('data-blood') || '';
    }
  </script>

</body>

</html>
