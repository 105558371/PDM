<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Blood Inventory')"></head>

<body>
  <div th:replace="layout :: navbar"></div>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-blood-red">Available Blood Bags</h2>
      <a href="/doctor/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
    </div>
    <form method="get" class="row g-3 mb-4">
      <div class="col-auto">
        <label>Filter by Blood Type</label>
        <select name="bloodType" class="form-select">
          <option value="">All</option>
          <option th:each="t : ${ {'A+','A-','B+','B-','O+','O-','AB+','AB-'} }" th:value="${t}" th:text="${t}"
            th:selected="${param.bloodType == t}"></option>
        </select>
      </div>
      <div class="col-auto align-self-end">
        <button type="submit" class="btn btn-blood-red">Filter</button>
      </div>
    </form>

    <table class="table table-bordered">
      <thead class="table-danger">
        <tr>
          <th>Blood Type</th>
          <th>Expiry Date</th>
          <th>Blood Bank</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="bag : ${bags}">
          <td th:text="${bag.bloodType}">O+</td>
          <td th:text="${bag.expdate}">2025-06-01</td>
          <td th:text="${bag.bankName}">Central Bank</td>
        </tr>
        <tr th:if="${#lists.isEmpty(bags)}">
          <td colspan="4" class="text-center text-danger">No available blood bags</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div th:replace="layout :: footer"></div>
</body>

</html>
