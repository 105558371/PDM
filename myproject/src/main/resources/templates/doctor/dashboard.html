<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Doctor Dashboard')"></head>

<body>
  <div th:replace="layout :: navbar"></div>
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">Doctor Info</div>
          <div class="card-body">
            <p><strong>Name:</strong> <span th:text="${doctor.name}"></span></p>
            <p><strong>Specialization:</strong> <span th:text="${doctor.specialization}"></span></p>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">Actions</div>
          <div class="card-body">
            <a href="/doctor/inventory" class="btn btn-blood-red me-2">View Blood Inventory</a>
            <a href="/doctor/new-request" class="btn btn-outline-danger me-2">Request Blood</a>
            <a href="/doctor/my-requests" class="btn btn-outline-secondary">My Requests</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div th:replace="layout :: footer"></div>
</body>

</html>
