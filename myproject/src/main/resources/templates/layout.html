<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' - 4Blood'">4Blood</title>
  <!-- Bootstrap CSS (WebJars) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Navigation Bar Fragment -->
  <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-blood-red" data-bs-theme="dark">
    <div class="container">
      <h3 class="card-header text-center">4BLOOD</h3>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content Fragment -->
  <div th:fragment="content" class="container my-4">
    <!-- This is where child templates will insert their content -->
  </div>

  <!-- Footer Fragment -->
  <footer th:fragment="footer" class="mt-5 py-3 text-center">
    <div class="container">
      <p class="mb-0">&copy; 2025 4Blood – For blood, for life, for all</p>
      <small>Email: help_4blood@mail.com | Phone: +0 123 456 789</small>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle (for responsive navbar) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
