<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Login')"></head>

<body>
  <div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow">
      <div class="card-header text-center">
        <h3>Login to 4Blood</h3>
      </div>
      <div class="card-body">
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-blood-red w-100">Login</button>
        </form>
        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
        <hr>
        <p class="text-center mb-0">Don't have an account? <a th:href="@{/signup}" class="text-blood-red">Sign up as Donor</a>
        </p>
      </div>
    </div>
  </div>
</body>

</html>
