<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Edit Profile')"></head>

<body>
  <div th:replace="layout :: navbar"></div>
  <div class="container mt-4" style="max-width: 500px;">
    <div class="card">
      <div class="card-header">Edit Profile</div>
      <div class="card-body">
        <form th:action="@{/donor/edit-profile}" method="post">
          <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" th:value="${user.username}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>New Password (leave blank to keep current)</label>
            <input type="password" name="password" class="form-control">
          </div>
          <div class="mb-3">
            <label>Phone</label>
            <input type="text" name="contact" th:value="${donor.contact}" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-blood-red">Save Changes</button>
          <a href="/donor/dashboard" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
  <div th:replace="layout :: footer"></div>
</body>

</html>
