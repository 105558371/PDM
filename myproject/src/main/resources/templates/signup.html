<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Sign Up')"></head>

<body>
  <div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow">
      <div class="card-header text-center">
        <h3>Donor Registration</h3>
      </div>
      <div class="card-body">
        <form th:action="@{/signup}" method="post">
          <div class="mb-3">
            <label>Full Name</label>
            <input type="text" name="fullName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Phone</label>
            <input type="text" name="contact" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Blood Type</label>
            <select name="bloodType" class="form-select">
              <option th:each="t : ${ {'A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'} }" th:value="${t}" th:text="${t}"></option>
            </select>
          </div>
          <button type="submit" class="btn btn-blood-red w-100">Register</button>
        </form>
        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
      </div>
    </div>
  </div>
</body>

</html>
